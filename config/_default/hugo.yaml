# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://vidminas.github.io/'

# Skip Hugo's built-in CSS minifier (tdewolff). It has corrupted the
# hand-authored assets/css/custom.css (which is served through the
# `| minify` pipeline in the theme's site_head.html) -- e.g. stripping
# the space between two calc() values, dropping the declaration. The main
# Tailwind bundle is minified separately by Lightning CSS and is
# unaffected; the only cost here is that custom.css and any inline
# <style> ship unminified (negligible over gzip).
minify:
  disableCSS: true

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

cascade:
  - target:
      path: /slides/**
      kind: page
    outputs: [HTML, present]

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  # Hugo 0.165.0 dropped `tailwindcss` from the default exec allowlist
  # (CVE-2026-89259), so css.TailwindCSS in the theme's css.html must be
  # opted into explicitly. Setting `allow` replaces the default list
  # rather than extending it: this is Hugo 0.167's defaults plus
  # `^tailwindcss$`.
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$
sitemap:
  _merge: deep
